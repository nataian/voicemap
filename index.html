<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bản Đồ Rèn Giọng</title><meta name="description" content="Đăng ký khóa Bản Đồ Rèn Giọng cùng Kindtech – Giọng An."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><style id="site-css">/* Layout: thanh menu xanh trên cùng, 2/3 nội dung bên trái, 1/3 khung đăng ký cố định bên phải. Quản trị dùng cùng khung sườn. */
:root{
  --ink:#1F3A4B;         /* Thủy: màu chữ */
  --frame:#A8402E;       /* Hỏa: viền / nền khung chữ */
  --panel:#3F6B4A;       /* Mộc: nền nội dung / menu */
  --icon:#8B6F4E;        /* Thổ: icon minh họa */
  --page:#FBF5E9;        /* Kim: nền trang */
  --card:#FFFCF5;
  --line:rgba(31,58,75,0.14);
  --gold:#C9A15A;
  --soft-frame:rgba(168,64,46,0.08);
  --soft-panel:rgba(63,107,74,0.09);
  --soft-icon:rgba(139,111,78,0.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#20241D; --card:#2A2E23; --ink:#EFE7D6; --line:rgba(239,231,214,0.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#20241D; --card:#2A2E23; --ink:#EFE7D6; --line:rgba(239,231,214,0.18); color-scheme:dark;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:76px;}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Nunito',sans-serif;font-size:16px;line-height:1.7;}
h1,h2,h3,.display{font-family:'Be Vietnam Pro',sans-serif;}
h1,h2,h3,p,ul{margin:0;}
img{max-width:100%;display:block;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--frame);outline-offset:2px;}
.nav :focus-visible,footer :focus-visible,.a-nav :focus-visible{outline-color:#fff;}

/* ---- NAV ---- */
.nav{position:sticky;top:0;z-index:50;background:var(--panel);color:#fff;}
.nav-inner{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:36px;}
.nav-brand{font-family:'Be Vietnam Pro',sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;flex:none;text-transform:uppercase;}
.nav-links{display:flex;gap:26px;list-style:none;flex-wrap:wrap;margin:0;padding:0;}
.nav-links a{font-size:14.5px;font-weight:600;opacity:.92;text-decoration:none;}
.nav-links a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px;}
.nav-links a.inert{cursor:default;}
.nav-toggle{display:none;background:none;border:none;color:#fff;font-size:22px;margin-left:auto;cursor:pointer;}

/* ---- LAYOUT ---- */
.layout{max-width:1240px;margin:0 auto;padding:24px 24px 40px;display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:40px;align-items:start;}
.col-main{min-width:0;}
.col-side{position:sticky;top:80px;}

/* ---- HERO ---- */
.hero-quote{background:var(--card);border:1px solid var(--frame);border-left:5px solid var(--frame);border-radius:14px;padding:30px 28px;margin:0 0 30px;font-size:21px;}
.hero-quote p{margin-bottom:16px;}
.hero-quote p:last-child{margin-bottom:0;}
.course-title{font-size:clamp(30px,5vw,46px);font-weight:800;color:var(--frame);line-height:1.2;margin:10px 0 20px;text-transform:uppercase;text-wrap:balance;}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 22px;font-weight:700;font-size:19px;margin-bottom:26px;}
.hero-meta span{display:flex;align-items:center;gap:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--icon);flex:none;}

/* ---- ĐỒNG HỒ ĐẾM NGƯỢC ---- */
.cd{margin-bottom:28px;}
.cd-row{display:flex;gap:10px;}
.cd-box{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 55%),var(--panel);color:#fff;border-radius:14px;padding:16px 4px 14px;text-align:center;flex:1;max-width:108px;border-bottom:3px solid var(--gold);}
.cd-num{font-family:'Be Vietnam Pro',sans-serif;font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;}
.cd-label{font-size:13px;margin-top:8px;opacity:.9;}
.cd-bar{height:6px;border-radius:99px;background:var(--line);margin-top:16px;overflow:hidden;max-width:462px;}
.cd-bar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px;transition:width .9s linear;}

.cta{display:inline-block;background:var(--frame);color:#fff;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:16px;line-height:1.5;padding:16px 34px;border-radius:12px;text-decoration:none;border:none;cursor:pointer;text-align:center;transition:transform .15s ease, box-shadow .15s ease;}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(168,64,46,.28);}
.cta-green{background:var(--panel);}
.cta-green:hover{box-shadow:0 10px 22px rgba(63,107,74,.3);}
.cta-off{opacity:.55;cursor:not-allowed;}
.cta-off:hover{transform:none;box-shadow:none;}
.cta-block{margin-bottom:8px;}

/* thông báo trạng thái ghi danh */
.notice{background:var(--card);border:1px solid var(--frame);border-left:5px solid var(--frame);border-radius:14px;padding:22px 24px;font-size:19px;}
.notice p+p{margin-top:10px;}
.notice .cta{margin-top:14px;}
.notice.mini{padding:16px 16px;font-size:15.5px;}
.notice.mini .cta{width:100%;}

/* ---- SECTIONS ---- */
section{padding:44px 0;border-top:1px solid var(--line);}
section:first-of-type{border-top:none;}
.col-main>section:first-child{padding-top:0;}
.section-title{font-size:clamp(22px,3.2vw,30px);font-weight:800;color:var(--ink);margin-bottom:22px;display:flex;align-items:center;gap:14px;text-wrap:balance;}
.section-icon{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;}
.section-icon svg{width:24px;height:24px;}
.reveal{transition:opacity .6s ease,transform .6s ease;}
.reveal.pre{opacity:0;transform:translateY(16px);}
@media (prefers-reduced-motion: reduce){.reveal{transition:none;}.reveal.pre{opacity:1;transform:none;}.cd-bar i{transition:none;}}

ul.plain{list-style:none;padding:0;}
ul.plain li{position:relative;padding-left:28px;margin-bottom:16px;font-size:20px;}
ul.plain li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:2px;background:var(--icon);}
.body-p{font-size:20px;margin-bottom:16px;}

/* lộ trình */
.roadmap-pill{background:var(--panel);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:22px;font-weight:600;font-size:19px;}
.timeline{position:relative;padding-left:6px;}
.timeline-item{display:flex;gap:18px;position:relative;padding-bottom:30px;}
.timeline-item:last-child{padding-bottom:0;}
.timeline-marker{flex:none;display:flex;flex-direction:column;align-items:center;width:16px;}
.timeline-dot{width:16px;height:16px;border-radius:50%;background:var(--frame);border:3px solid var(--card);box-shadow:0 0 0 2px var(--frame);flex:none;}
.timeline-track{width:2px;flex:1;background:var(--line);margin-top:4px;}
.timeline-body{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.timeline-time{display:flex;flex-wrap:wrap;gap:8px 16px;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:16px;color:var(--frame);margin-bottom:6px;}
.timeline-session{font-size:19px;font-weight:700;color:var(--ink);}

/* học phí */
.tuition-price{font-family:'Be Vietnam Pro',sans-serif;font-weight:800;font-size:38px;color:var(--frame);margin:6px 0 18px;}
.tuition-list li{margin-bottom:12px;font-size:19px;}
.tuition-cta{margin-top:8px;}

/* cảm nhận học viên */
.voices-intro{font-size:19px;margin-bottom:22px;}
.voices{columns:2 260px;column-gap:18px;}
.v-card{display:block;break-inside:avoid;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.v-imgbtn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;}
.v-imgbtn img{width:100%;height:auto;}
.v-cap{padding:12px 16px;font-size:16.5px;}
.v-quote{padding:22px 22px 18px;font-size:19px;line-height:1.65;}
.v-quote p+p{margin-top:10px;}
.v-name{display:block;margin-top:12px;font-style:normal;font-weight:700;color:var(--frame);font-size:16px;}
.v-video{text-decoration:none;color:inherit;}
.v-thumb{position:relative;aspect-ratio:16/9;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.v-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.v-play{position:relative;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--frame);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);}
.v-play svg{width:26px;height:26px;margin-left:3px;fill:currentColor;stroke:none;}
.v-video:hover .v-play{transform:scale(1.06);}
.v-play{transition:transform .15s ease;}
.v-yt{display:inline-block;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.04em;color:#fff;background:var(--frame);border-radius:6px;padding:1px 8px;margin-right:8px;}

/* slogan */
.slogan{text-align:center;padding:56px 0;}
.slogan p{font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:clamp(18px,2.6vw,24px);color:var(--frame);line-height:1.9;}

/* chân trang */
footer{background:var(--panel);color:#fff;text-align:center;padding:34px 24px calc(20px + env(safe-area-inset-bottom,0px));}
footer p{font-size:14.5px;margin-bottom:6px;}
footer .copy{opacity:.75;font-size:12.5px;margin-top:10px;}
.admin-btn{display:block;margin:14px auto 0;background:none;border:0;color:#fff;opacity:.3;font:600 10px/1 'Be Vietnam Pro',sans-serif;letter-spacing:.08em;padding:6px 10px;cursor:pointer;border-radius:6px;}
.admin-btn:hover,.admin-btn:focus-visible{opacity:.85;}

/* ---- KHUNG ĐĂNG KÝ BÊN PHẢI ---- */
.side-card{background:var(--card);border:1px solid var(--frame);border-radius:16px;overflow:hidden;}
.side-card img{width:100%;}
.side-body{padding:20px;}
.side-title{font-family:'Be Vietnam Pro',sans-serif;font-weight:800;font-size:26px;line-height:1.25;color:var(--frame);margin-bottom:14px;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;}
.side-price-row{display:flex;align-items:center;gap:10px;background:var(--soft-frame);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.side-price{font-family:'Be Vietnam Pro',sans-serif;font-weight:800;font-size:21px;color:var(--frame);}
.side-sessions{list-style:none;padding:0;margin-bottom:10px;}
.side-sessions li{display:flex;align-items:center;gap:10px;background:var(--soft-panel);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:14px;font-weight:700;}
.side-meta{font-size:14.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:10px;background:var(--soft-icon);border-radius:10px;padding:9px 12px;}
.icon-badge{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
.icon-badge svg{width:15px;height:15px;}
.side-cta{display:block;width:100%;margin-top:14px;}
.side-slot{margin-top:14px;}
.side-slot .cta{display:block;width:100%;}

/* thanh CTA dưới cùng trên điện thoại */
.mobile-cta{display:none;}

/* ---- Lớp phủ: phóng ảnh, hộp thoại, thông báo ---- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(20,28,22,.86);display:flex;align-items:center;justify-content:center;padding:20px;}
.ov img{max-width:100%;max-height:100%;border-radius:10px;background:#fff;}
.ov-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;font-size:20px;cursor:pointer;}
.modal{background:var(--card);color:var(--ink);border-radius:16px;max-width:460px;width:100%;padding:26px 24px;border:1px solid var(--line);}
.modal h3{font-size:20px;color:var(--frame);margin-bottom:10px;}
.modal p{font-size:16.5px;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:120;max-width:calc(100% - 32px);text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.err{background:var(--frame);}

/* ---- QUẢN TRỊ ---- */
.a-nav{position:sticky;top:0;z-index:50;background:var(--panel);color:#fff;}
.a-nav .nav-inner{gap:20px;}
.a-tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin;}
.a-tab{flex:none;background:none;border:0;color:#fff;opacity:.85;font:600 14.5px 'Nunito',sans-serif;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.a-tab:hover{opacity:1;background:rgba(255,255,255,.1);}
.a-tab[aria-selected="true"]{opacity:1;background:rgba(255,255,255,.18);}
.a-h{font-size:clamp(22px,3vw,28px);font-weight:800;color:var(--ink);margin:30px 0 18px;}
.a-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;}
.a-card>h3{font-size:18px;color:var(--frame);margin-bottom:14px;}
.a-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.a-field:last-child{margin-bottom:0;}
.a-field>label,.a-lab{font-weight:700;font-size:15px;}
.a-hint{font-size:13.5px;opacity:.78;line-height:1.5;}
.a-in{font:16px/1.5 'Nunito',sans-serif;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;}
textarea.a-in{min-height:84px;resize:vertical;}
.a-in:focus-visible{outline:2px solid var(--frame);outline-offset:1px;}
.a-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;}
.a-row .a-in{flex:1;}
.a-ico{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.a-ico:disabled{opacity:.35;cursor:default;}
.a-ico:hover:not(:disabled){background:var(--soft-frame);}
.a-btn{font:700 15px 'Be Vietnam Pro',sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer;}
.a-btn:hover{background:var(--soft-panel);}
.a-btn:disabled{opacity:.5;cursor:default;}
.a-btn.primary{background:var(--frame);border-color:var(--frame);color:#fff;}
.a-btn.primary:hover{background:var(--frame);box-shadow:0 8px 18px rgba(168,64,46,.25);}
.a-btn.green{background:var(--panel);border-color:var(--panel);color:#fff;}
.a-btn.green:hover{background:var(--panel);}
.a-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.a-sub{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--page);}
.a-sub-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.a-sub-h b{flex:1;font-family:'Be Vietnam Pro',sans-serif;font-size:15px;}
.a-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.a-grid .wide{grid-column:1 / -1;}
.a-check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin:8px 0;}
.a-check input{width:18px;height:18px;accent-color:var(--panel);}
.a-chip{display:inline-block;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:13.5px;padding:4px 12px;border-radius:99px;color:#fff;}
.a-chip.open{background:var(--panel);}
.a-chip.draft{background:var(--icon);}
.a-chip.closed{background:var(--frame);}
.a-thumb{width:100%;max-width:300px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px;}
.a-warn{color:var(--frame);font-weight:700;font-size:14px;}
.a-side{display:flex;flex-direction:column;gap:16px;}
.a-save{background:var(--card);border:1px solid var(--frame);border-radius:16px;padding:18px;}
.a-save .a-btn{width:100%;margin-bottom:8px;}
.a-stat{font-size:14.5px;font-weight:700;margin-bottom:12px;}
.a-stat.err{color:var(--frame);}
.a-stat.ok{color:var(--panel);}
.a-size{font-size:13px;opacity:.8;margin-top:4px;}
.a-banner{background:var(--soft-icon);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600;}
.a-banner span{flex:1;min-width:200px;}
.pv-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--frame);color:#fff;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;font-weight:700;}
.pv-bar .a-btn{background:#fff;color:var(--frame);border-color:#fff;}
.pv-bar .a-btn.green{background:var(--panel);color:#fff;border-color:var(--panel);}

@media (max-width: 900px){
  .layout{grid-template-columns:1fr;}
  .col-side{position:static;}
  .nav-links{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--panel);flex-direction:column;justify-content:center;align-items:center;gap:26px;transform:translateY(-100%);transition:transform .25s ease;}
  .nav-links.open{transform:translateY(0);}
  .nav-links a{font-size:19px;}
  .nav-toggle{display:block;position:relative;z-index:2;}
  body.has-bar{padding-bottom:78px;}
  .mobile-cta{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--frame);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));justify-content:center;}
  .mobile-cta:empty{display:none;}
  .mobile-cta .cta{width:100%;background:#fff;color:var(--frame);}
  .timeline-time{font-size:14.5px;}
  .timeline-session{font-size:17px;}
  .a-side{position:static;}
  .a-save{position:fixed;left:0;right:0;bottom:0;z-index:60;border-radius:16px 16px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .a-save .a-btn{width:auto;flex:1;margin:0;}
  .a-save .a-stat{flex-basis:100%;margin:0;}
  .a-save .a-size{display:none;}
  #admin{padding-bottom:130px;}
}
@media (max-width: 560px){
  .layout{padding:0 16px 32px;}
  .nav-inner{padding:12px 16px;gap:16px;}
  .hero-quote{font-size:19px;padding:24px 20px;}
  ul.plain li,.body-p{font-size:18px;}
  .cd-num{font-size:28px;}
  .a-grid{grid-template-columns:1fr;}
  .a-card{padding:18px 16px;}
}

/* bổ sung */
.section-title{text-transform:uppercase;}
.roadmap-pill.tail{margin-top:22px;margin-bottom:0;}
.side-slot:empty{display:none;}
.side-slot .cta{display:block;width:100%;}
.nav-links a.inert{opacity:.92;}
.v-video{display:block;text-decoration:none;color:inherit;}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);}
.a-file{position:relative;display:inline-block;cursor:pointer;}
.a-file:focus-within{outline:2px solid var(--frame);outline-offset:2px;}

n vành rõ chữ, ngại nói trước mọi người, chưa đủ tự tin để nghe lại giọng mình.","Bạn có nhiều thông điệp ý nghĩa, lời hay ý đẹp muốn truyền đạt nhưng chưa tự tin vì cảm thấy giọng mình chưa được truyền cảm.","Bạn gặp khó khăn khi giao tiếp, kết nối với mọi người xung quanh, từ gia đình đến bạn bè, đồng nghiệp.","Bạn chưa biết bắt đầu rèn luyện từ đâu, chưa có lộ trình rõ ràng và môi trường để duy trì việc rèn giọng an vui, hiệu quả."]},"audience":{"title":"HÀNH TRÌNH NÀY DÀNH CHO NHỮNG AI MONG MUỐN:","items":["Hiểu được giọng mình, có lộ trình và bản đồ rèn luyện phù hợp, rõ ràng, hiệu quả.","Chưa biết hoặc đã biết mình có đam mê rèn giọng và mong muốn rèn luyện thành sở trường.","Có môi trường duy trì động lực rèn giọng trong và sau khóa học.","Ứng dụng giọng nói hiệu quả trong công việc, giao tiếp, gắn kết gia đình, học tập và phụng sự."]},"roadmap":{"title":"LỘ TRÌNH BẢN ĐỒ RÈN GIỌNG","pillTop":"21 buổi BTC đồng hành bao gồm 7 buổi học chính qua zoom.","sessions":[{"date":"T3 03/11","time":"20h – 21h30","name":"Buổi 1: Rèn cột hơi, chất giọng"},{"date":"T7 07/11","time":"20h – 21h30","name":"Buổi 2: Rèn kỹ năng phát âm (nguyên âm, phụ âm, thanh điệu)"},{"date":"T3 10/11","time":"20h – 21h30","name":"Buổi 3: Ngữ điệu và tốc độ"},{"date":"T7 14/11","time":"20h – 21h30","name":"Buổi 4: Giao tiếp hiệu quả"},{"date":"T3 17/11","time":"20h – 21h30","name":"Buổi 5: Tôi yêu tiếng nói tôi"},{"date":"T7 21/11","time":"20h – 21h30","name":"Buổi 6: Hành trình tự rèn"},{"date":"T3 24/11","time":"20h – 21h30","name":"Buổi 7: Bế giảng"}],"pillBottom":"21 buổi duy trì rèn luyện sau khóa học cùng cộng đồng Kindtech – Giọng An."},"tuition":{"title":"HỌC PHÍ","price":"450.000đ","items":["Voucher giảm 50% dành cho các bạn từng là Mentor Kindtech/Giọng An đăng ký học trực tiếp.","Voucher giảm 50%: Học viên bản đồ rèn giọng muốn đăng ký học lại.","Miễn phí 100% với quý Sư/Ni cần rèn giọng phụng sự Tam Bảo và đại chúng."]},"voices":{"title":"","intro":"","cards":[]},"extra":[],"slogan /* ---------- trang công khai ---------- */
function cardHas(c){return !!(okImg(c.img)||trim(c.text)||trim(c.name)||vidUrl(c.yt));}
function hasX(e){return !!(trim(e.title)||filt(e.body).length);}
function has(s,k){
  var x=s[k];

    case 'roadmap':return !!(trim(x.title)||trim(x.pillTop)||trim(x.pillBottom)||x.sessions.length);
    case 'tuition':return !!(trim(x.title)||trim(x.price)||filt(x.items).length);

function tuitionH(s){

function cardH(s,c,i){

function voicesH(s){

function extrasH(s){

function sloganH(s){var a=filt(s.slogan);return a.length?'<section class="slogan"><p>'+a.map(function(t){return X(s,t);}).join('<br>')+'</p></section>':'';}
function sideH(s){

  if(ss.length)h+='<ul class="side-sessions">'+ss.map(function(a){return '<li>'+badge('var(--panel)',a[1])+X(s,a[0])+'</li>';}).join('')+'</ul>';

function footerH(s){

  return '<footer>'+(trim(f.l1)?'<p>'+X(s,f.l1)+'</p>':'')+(trim(f.l2)?'<p>'+X(s,f.l2)+'</p>':'')+(trim(f.copy)?'<p class="copy">'+X(s,f.copy)+'</p>':'')

function siteHtml(s,pv){
  return navH(s)+'<div class="layout"><div class="col-main">'+introH(s)+listSec(s,'problem')+listSec(s,'audience')+roadH(s)+tuitionH(s)+voicesH(s)+extrasH(s)+sloganH(s)

function viewState(){return mode==='preview'&&D?D:S;}
function fillSlots(s){
  var els=document.querySelectorAll('#site [data-slot]');
  for(var i=0;i<els.length;i++)els[i].innerHTML=slotHtml(s,els[i].getAttribute('data-slot'));
  var m=document.querySelector('#site .mobile-cta');
  document.body.classList.toggle('has-bar',!!(m&&m.innerHTML));
  lastPhase=phase(s,Date.now());
}
function tickCD(s){
  var en=endMs(s),d=$('cd-d');
  if(!d||!en)return;
  var diff=Math.max(0,en-Date.now()),p2=function(n){return String(n).padStart(2,'0');};
  d.textContent=Math.floor(diff/86400000);
  $('cd-h').textContent=p2(Math.floor(diff%86400000/3600000));
  $('cd-m').textContent=p2(Math.floor(diff%3600000/60000));
  $('cd-s').textContent=p2(Math.floor(diff%60000/1000));
  var tot=en-s.enroll.startedAt,b=$('cd-bar');
  if(b)b.style.width=(tot>0?Math.min(100,diff/tot*100):0)+'%';
}
function tick(){
  if(mode==='admin')return;
  var s=viewState();
  if(phase(s,Date.now())!==lastPhase)fillSlots(s);
  tickCD(s);
}
function renderSite(s,pv){
  $('site').innerHTML=siteHtml(s,pv);
  document.title=titleOf(s);
  fillSlots(s);tickCD(s);
}

var toastT=0;
function toast(msg,err){var t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='toast';},3800);}
function ask(title,msg,ok,cancel){

/* ---------- tài khoản quản trị ---------- */
var ITER=150000;
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(t){var s=atob(t),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function hashPw(pw,salt,it){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:it},k,256);
  }).then(b64);
}
function newAcc(u,pw){
  var salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  return hashPw(pw,salt,ITER).then(function(h){return {u:u,salt:salt,it:ITER,h:h};});
}
function findAcc(list,u){u=trim(u).toLowerCase();for(var i=0;i<list.length;i++)if(list[i].u===u)return list[i];return null;}
function okUser(u){return /^[a-z0-9._-]{3,32}$/.test(u);}
function setAuth(a){AUTH=a.u;try{sessionStorage.setItem('bdrg-auth',a.u+'|'+a.h);}catch(e){}}
function savedAuth(){
  try{var v=(sessionStorage.getItem('bdrg-auth')||'').split('|'),a=findAcc(S.admins,v[0]);if(a&&a.h===v[1]){AUTH=a.u;return true;}}catch(e){}
  return false;
}
function authDialog(setup){
  var o=$('ov');o.hidden=false;o.className='ov';modalRes=null;
  o.innerHTML='<form class="modal" id="auth-f" role="dialog" aria-modal="true" aria-labelledby="m-t"><h3 id="m-t">'+(setup?'Tạo tài khoản quản trị đầu tiên':'Đăng nhập quản trị')+'</h3>'
    +'<div class="a-field"><label for="au-u">Tên đăng nhập</label><input class="a-in" id="au-u" autocomplete="username" autocapitalize="none" spellcheck="false"></div>'
    +'<div class="a-field"><label for="au-p">Mật khẩu</label><input class="a-in" id="au-p" type="password" autocomplete="'+(setup?'new-password':'current-password')+'"></div>'
    +(setup?'<div class="a-field"><label for="au-p2">Nhập lại mật khẩu</label><input class="a-in" id="au-p2" type="password" autocomplete="new-password">'+hint('Tên 3–32 ký tự (chữ thường, số, . _ -). Mật khẩu từ 8 ký tự.')+'</div>':'')
    +'<div class="a-stat err" id="au-e" role="alert"></div>'
    +'<div class="modal-actions"><button type="button" class="a-btn" data-m="0">Hủy</button><button type="submit" class="a-btn primary">'+(setup?'Tạo và vào quản trị':'Đăng nhập')+'</button></div></form>';
  $('au-u').focus();
  $('auth-f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var u=trim($('au-u').value).toLowerCase(),p=$('au-p').value,er=$('au-e');
    if(setup){
      if(!okUser(u)){er.textContent='Tên đăng nhập chưa hợp lệ.';return;}
      if(p.length<8){er.textContent='Mật khẩu cần ít nhất 8 ký tự.';return;}
      if(p!==$('au-p2').value){er.textContent='Hai mật khẩu chưa giống nhau.';return;}
      er.textContent='Đang tạo…';
      newAcc(u,p).then(function(a){closeOv(false);D=clone(S);D.admins=[a];setAuth(a);mode='admin';doPublish();},function(){er.textContent='Trình duyệt này không hỗ trợ mã hóa mật khẩu.';});
      return;
    }
    var a=findAcc(S.admins,u);er.textContent='Đang kiểm tra…';
    var pr=a?hashPw(p,a.salt,a.it):Promise.resolve('');
    pr.then(function(h){
      if(a&&h===a.h){fails=0;setAuth(a);closeOv(false);openAdmin();}
      else{fails++;setTimeout(function(){er.textContent='Sai tên đăng nhập hoặc mật khẩu.';},Math.min(fails,5)*700);}
    },function(){er.textContent='Trình duyệt này không hỗ trợ mã hóa mật khẩu.';});
  });
}
function gate(){
  if(!canEdit){ask('Khu vực quản trị','Chỉ người có quyền chỉnh sửa trang này mới vào được.','Đóng',false);return;}
  if(!S.admins.length){authDialog(true);return;}
  if(savedAuth()){openAdmin();return;}
  authDialog(false);
}
function addAccount(){
  var u=trim($('acc-u').value).toLowerCase(),p=$('acc-p').value;
  if(!okUser(u)){toast('Tên đăng nhập chưa hợp lệ.',true);return;}
  if(p.length<8){toast('Mật khẩu cần ít nhất 8 ký tự.',true);return;}
  if(p!==$('acc-p2').value){toast('Hai mật khẩu chưa giống nhau.',true);return;}
  newAcc(u,p).then(function(a){
    var ex=findAcc(D.admins,u);
    if(ex)D.admins[D.admins.indexOf(ex)]=a;else D.admins.push(a);
    renderAdmin();markDirty();toast('Đã thêm tài khoản — bấm Xuất bản để áp dụng.');
  },function(){toast('Trình duyệt này không hỗ trợ mã hóa mật khẩu.',true);});
}

function rowBtns(p,i,n){

function compress(file,maxW,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,maxW/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      try{res(c.toDataURL('image/jpeg',q));}catch(e){rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    im.src=url;
  });
}

  if(p==='roadmap.sessions')return {date:'',time:'20h – 21h30',name:''};

function validate(d){
  if(!trim(d.name))return {msg:'Hãy nhập tên khóa học.',tab:'intro'};
  if(trim(d.cta.url)&&!safeUrl(d.cta.url))return {msg:'Link Google Form cần bắt đầu bằng https://',tab:'enroll'};
  if(trim(d.enroll.zaloUrl)&&!safeUrl(d.enroll.zaloUrl))return {msg:'Link của nút sau khi kết thúc cần bắt đầu bằng https://',tab:'enroll'};
  if(d.enroll.endAt&&isNaN(Date.parse(d.enroll.endAt)))return {msg:'Ngày giờ kết thúc tuyển sinh chưa hợp lệ.',tab:'enroll'};
  for(var i=0;i<d.voices.cards.length;i++){var y=d.voices.cards[i].yt;if(trim(y)&&!vidUrl(y))return {msg:'Link video ở Cảm nhận '+(i+1)+' chưa hợp lệ.',tab:'voices'};}
  return null;
}
function doPublish(){
  if(busy)return;
  var err=validate(D);
  if(err){toast(err.msg,true);if(mode!=='admin')backToAdmin();tab=err.tab;renderAdmin();return;}
  if(!ART){toast('Không kết nối được tính năng lưu trang.',true);return;}
  busy=true;
  var st=$('a-stat');if(st){st.textContent='Đang xuất bản…';st.className='a-stat';}
  toast('Đang xuất bản…');
  var html;
  try{html=buildDoc(D);}catch(e){busy=false;toast('Không tạo được trang để xuất bản.',true);return;}
  try{sessionStorage.setItem('bdrg-admin',tab);}catch(e){}
  ART.publish(html).then(function(){toast('Đã xuất bản — trang đang tải lại…');},function(e){
    busy=false;
    try{sessionStorage.removeItem('bdrg-admin');}catch(x){}
    var c=e&&e.code,m='Không xuất bản được. Vui lòng thử lại.';
    if(c==='conflict')m='Trang vừa được cập nhật ở nơi khác; đang tải bản mới, hãy làm lại thay đổi.';
    else if(c==='not_writer'||c==='not_granted')m='Bạn không có quyền chỉnh sửa trang này.';
    else if(c==='too_large')m='Trang vượt quá dung lượng cho phép — hãy dùng ảnh nhỏ hơn.';
    else if(c==='rate_limited')m='Xuất bản quá nhanh, vui lòng thử lại sau vài giây.';
    toast(m,true);stat();
  });
}

function act(b){
  var a=b.dataset.act,p=b.dataset.p,i=parseInt(b.dataset.i,10),arr;
  switch(a){
    case 'nav':var n=$('nav-links'),o=n.classList.toggle('open');b.setAttribute('aria-expanded',String(o));break;
    case 'admin':gate();break;
    case 'addacc':addAccount();break;
    case 'delacc':D.admins.splice(i,1);renderAdmin();markDirty();break;
    case 'logout':try{sessionStorage.removeItem('bdrg-auth');}catch(e){}AUTH='';leave();break;
    case 'tab':tab=b.dataset.tab;renderAdmin();window.scrollTo(0,0);break;
    case 'add':arr=gp(D,p);arr.push(mk(p));renderAdmin();focusAt(p,arr.length-1);markDirty();break;
    case 'del':gp(D,p).splice(i,1);renderAdmin();markDirty();break;
    case 'up':case 'down':
      arr=gp(D,p);var j=a==='up'?i-1:i+1;
      if(j>=0&&j<arr.length){var t=arr[i];arr[i]=arr[j];arr[j]=t;renderAdmin();markDirty();}
      break;
    case 'imgdel':sp(D,p,'');renderAdmin();markDirty();break;
    case 'start':
      ask('Bắt đầu tuyển sinh','Trang sẽ được xuất bản ngay'+(D.enroll.endAt?' và đồng hồ đếm ngược bắt đầu chạy.':'. Chưa nhập thời điểm kết thúc nên sẽ chưa có đồng hồ đếm ngược.'),'Xác nhận','Hủy').then(function(ok){
        if(ok){D.enroll.startedAt=Date.now();doPublish();}
      });
      break;
    case 'unstart':D.enroll.startedAt=0;renderAdmin();markDirty();break;
    case 'endnow':D.enroll.endAt=new Date(Date.now()+25200000).toISOString().slice(0,16)+':00+07:00';renderAdmin();markDirty();break;
    case 'preview':preview();break;
    case 'back':backToAdmin();break;
    case 'publish':doPublish();break;
    case 'exit':
      if(JSON.stringify(D)!==JSON.stringify(S))ask('Thoát quản trị','Các thay đổi chưa xuất bản sẽ bị bỏ.','Thoát','Ở lại').then(function(ok){if(ok)leave();});
      else leave();
      break;
  }
}
